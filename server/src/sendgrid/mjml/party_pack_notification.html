<!doctype html>
<html>
    <head>
        <base target="_top" />
    </head>

    <body>
        There has been a party pack order for a birthday party!
        <br /><br />
        <i>Party Packs:</i><br />
        <ul>
            {{#partyPacks}}
            <li><b>{{.}}</b></li>
            {{/partyPacks}}
        </ul>
        <br /><br />
        <i>Party Details:</i><br />
        Date and Time: <i> {{ dateTime }} </i> <br />
        Location: <i> {{ location }} </i><br />
        Parent: <i> {{ parentName }} </i><br />
        Parent email: <i> {{ email }} </i><br />
        Parent mobile: <i> {{ mobile }} </i><br />
    </body>
</html>
