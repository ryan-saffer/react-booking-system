name: Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - "client/**"
      - "server/**"
      - "firebase.json"
      - ".firebaserc"
      - "client/predeploy.sh"
      - ".github/workflows/pipeline.yml"

  # Manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Use GitHub Environments so env-scoped secrets/approvals apply
    # Map branches to environments
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      contents: read

    env:
      # Only deploy to prod on pushes to main. All other contexts (PRs, manual PR runs,
      # pushes to develop, manual branch refs) deploy to dev.
      PROJECT_ID: ${{ github.ref_name == 'main' && 'bookings-prod' || 'booking-system-6435d' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
            server/fizz-kidz/package-lock.json

      - name: Create server .env from SERVER_ENV_FILE
        env:
          SERVER_ENV_FILE: ${{ vars.SERVER_ENV_FILE }}
        run: |
          if [ "${{ github.ref_name }}" = 'main' ]; then
            printf '%s' "$SERVER_ENV_FILE" > server/.env.prod
            printf '%s' "$SERVER_ENV_FILE" > server/.env.bookings-prod
            echo "Wrote server prod env files"
          else
            printf '%s' "$SERVER_ENV_FILE" > server/.env
            printf '%s' "$SERVER_ENV_FILE" > server/.env.booking-system-6435d
            echo "Wrote server dev env files"
          fi

      - name: Create client .env from CLIENT_ENV_FILE
        env:
          CLIENT_ENV_FILE: ${{ vars.CLIENT_ENV_FILE }}
        run: |
          if [ "${{ github.ref_name }}" = 'main' ]; then
            printf '%s' "$CLIENT_ENV_FILE" > client/.env.prod
            echo "Wrote client/.env.prod"
          else
            printf '%s' "$CLIENT_ENV_FILE" > client/.env
            echo "Wrote client/.env"
          fi

      # setup-node caches npm's downloaded package archives, but npm ci still recreates
      # node_modules. Cache each installed dependency tree separately so an unchanged
      # package can skip npm ci entirely. Exact keys prevent stale dependencies, while
      # the OS, architecture, and Node version protect native binaries such as canvas.
      - name: Cache dependencies (fizz-kidz)
        id: cache-fizz-kidz-dependencies
        uses: actions/cache@v4
        with:
          path: server/fizz-kidz/node_modules
          key: fizz-kidz-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'server/fizz-kidz/package-lock.json') }}

      - name: Cache dependencies (server)
        id: cache-server-dependencies
        uses: actions/cache@v4
        with:
          path: server/node_modules
          key: server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'server/package-lock.json') }}

      - name: Cache dependencies (client)
        id: cache-client-dependencies
        uses: actions/cache@v4
        with:
          path: client/node_modules
          key: client-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'client/package-lock.json') }}

      # Ensure local package builds have their toolchains
      - name: Install dependencies (fizz-kidz)
        if: steps.cache-fizz-kidz-dependencies.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: server/fizz-kidz

      # The two largest installs are independent, so run cache misses concurrently on
      # the same runner. A cache hit still skips only its corresponding installation.
      - name: Install dependencies (server and client)
        if: steps.cache-server-dependencies.outputs.cache-hit != 'true' || steps.cache-client-dependencies.outputs.cache-hit != 'true'
        env:
          SERVER_CACHE_HIT: ${{ steps.cache-server-dependencies.outputs.cache-hit }}
          CLIENT_CACHE_HIT: ${{ steps.cache-client-dependencies.outputs.cache-hit }}
        run: |
          server_pid=
          client_pid=

          if [ "$SERVER_CACHE_HIT" != "true" ]; then
            # Production uses @sparticuz/chromium and CI does not launch a browser.
            # Skip Puppeteer's separate Chrome download; local installs remain unchanged.
            PUPPETEER_SKIP_DOWNLOAD=true npm --prefix server ci --prefer-offline --no-audit --no-fund &
            server_pid=$!
          fi

          if [ "$CLIENT_CACHE_HIT" != "true" ]; then
            npm --prefix client ci --prefer-offline --no-audit --no-fund &
            client_pid=$!
          fi

          status=0
          if [ -n "$server_pid" ] && ! wait "$server_pid"; then
            echo "Server dependency installation failed"
            status=1
          fi
          if [ -n "$client_pid" ] && ! wait "$client_pid"; then
            echo "Client dependency installation failed"
            status=1
          fi
          exit "$status"

      - name: Run client tests
        run: npm test
        working-directory: client

      - name: Run server tests
        run: npm test
        working-directory: server

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Deploy Functions and Hosting
        env:
          GCLOUD_PROJECT: ${{ env.PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only functions,hosting \
            --project "$PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive \
            --force
