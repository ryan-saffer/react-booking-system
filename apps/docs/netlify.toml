# Netlify builds this site from the monorepo root so the shared package-lock.json
# is used to install dependencies. In the Netlify UI, set:
#   Base directory:    (unset - defaults to repository root)
#   Package directory: apps/docs
#
# All paths below are absolute paths relative to the base directory (repository root).
[build]
command = "npm run build --workspace docs"
publish = "apps/docs/dist"

# Only build when this app changes. Exit code 0 skips the build, 1 continues.
# Without this, every push to the repo (including apps/client and apps/server)
# would trigger a docs build and, for pull requests, a docs deploy preview.
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/docs"
